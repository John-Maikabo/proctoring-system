services: 
  - type: web 
    name: proctoring-system 
    runtime: node 
    region: oregon 
    buildCommand: npm install 
    startCommand: node server.js 
    envVars: 
      - key: NODE_ENV 
        value: production 
      - key: TWILIO_ACCOUNT_SID 
        sync: false 
      - key: TWILIO_API_KEY_SID 
        sync: false 
      - key: TWILIO_API_KEY_SECRET 
        sync: false 
